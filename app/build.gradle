plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meucroche.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meucroche.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '7.6.7-mobile-r3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
